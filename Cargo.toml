[package]
name = "library_app"
version = "0.1.0"
edition = "2024"

[dependencies]
topcoat = { path = "topcoat/crates/topcoat", features = [
    "router",
    "view",
    "serve",
    "tailwind",
    "asset",
    "cookie",
    "htmx",
    "discover"
] }
tokio = { version = "1.51", features = ["rt-multi-thread", "macros"] }
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
argon2 = "0.5"
jsonwebtoken = "9.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4"] }
http = "1.2"
moka = { version = "0.12", features = ["sync"] }

[dev-dependencies]
topcoat-asset = { path = "topcoat/crates/topcoat-asset", features = ["bundler"] }

[build-dependencies]
topcoat = { path = "topcoat/crates/topcoat", default-features = false, features = ["tailwind"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

